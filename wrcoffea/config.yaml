# WR analysis configuration
#
# Edit this file to change physics thresholds or add new eras without
# modifying Python code.  Loaded at import time by analysis_config.py.

# Integrated luminosities (fb^-1)
lumis:
  # UL16APV/UL16/UL17 and 2025 values are the PdmV golden-JSON numbers (2025 preliminary,
  # no normtag yet); the correction payloads for these eras are not in the repo yet.
  RunIISummer20UL16APV: 19.5
  RunIISummer20UL16: 16.8
  RunIISummer20UL17: 41.48
  RunIISummer20UL18: 59.83
  # 2022: luminosity of the data in the skims_v2 skims (brilcalc normtag_PHYSICS on the processed-lumi masks x golden
  # JSON; one number per era = mean of the electron and muon streams): Run3Summer22 = 2022B + C + D, ee 8.082 / mumu
  # 8.076 (2022B = 0.097, covered by the V4 JEC residual since 2026-10-07; C+D alone 7.986 / 7.979; golden C+D 7.99);
  # Run3Summer22EE = 2022E + F + G, ee 26.617 / mumu 26.669 (EGamma 2022E lacks 0.88 % of its certified lumisections
  # in the dataset itself; golden 26.68). Masks + result: data/lumis/Run3/2022/processed_skims_v2/ (2026-10-08).
  Run3Summer22: 8.08
  Run3Summer22EE: 26.64
  # 2023: luminosity of the data in the skims_v2 skims (brilcalc normtag_PHYSICS on the processed-lumi masks x golden
  # JSON; mean of the two PD halves): Run3Summer23 = 2023B + 2023C, ee 18.587 / mumu 18.588 (2023B = 0.624; it was
  # kept out on 2026-10-07 while the Summer23Prompt23_V2 JEC residuals started at 2023C, and brought back the same
  # day after the V4 payloads, whose residual covers it); Run3Summer23BPix = 2023D, ee 9.673 / mumu 9.677 (golden 9.68).
  # Masks + result: data/lumis/Run3/2023/processed_skims_v2/ (2026-10-07).
  Run3Summer23: 18.59
  Run3Summer23BPix: 9.675
  # Luminosity of the data in the skims_v2 2024 data skims (Run2024B-I), from brilcalc (normtag_PHYSICS) on the
  # processed-lumi masks of the skims intersected with the golden JSON: mumu 109.675, ee 109.722 (mean of the
  # Muon0/1 and EGamma0/1 halves; one number is used, within 0.02 % of both). The golden JSON alone gives 109.82
  # for C-I; the skims add 2024B (+0.13), lack runs 386615-386617 that exist only in PromptReco (-0.11) and lack
  # lumisections missing from the official datasets (-0.13 to -0.17). Masks, table and recipe:
  # data/lumis/Run3/2024/RunIII2024Summer24/processed_skims_v2/ and scripts/processed_lumi.py (2026-10-06).
  RunIII2024Summer24: 109.70
  RunIII2025Summer25: 110.63

# Default MC fileset tag per era.  Controls which DY variant is used
# when --dy is not explicitly given on the command line.
default_mc_tag:
  RunIISummer20UL16APV: dy_lo_ht
  RunIISummer20UL16: dy_lo_ht
  RunIISummer20UL17: dy_lo_ht
  RunIISummer20UL18: dy_lo_ht
  Run3Summer22: dy_lo_inc
  Run3Summer22EE: dy_lo_inc
  Run3Summer23: dy_lo_inc
  Run3Summer23BPix: dy_lo_inc
  RunIII2024Summer24: dy_lo_inc
  RunIII2025Summer25: dy_lo_inc

# Available --dy variants per era.  To add a new DY fileset for an era,
# create the JSON at data/filesets/.../{{era}}_mc_dy_{{variant}}_fileset.json
# and add the variant name here.
dy_variants:
  RunIISummer20UL16APV: [lo_inc, nlo_inc, lo_ht, nlo_mll, nlo_ptll, nlo_njet, nlo_njet_mll, lo_njet]
  RunIISummer20UL16: [lo_inc, nlo_inc, lo_ht, nlo_mll, nlo_ptll, nlo_njet, nlo_njet_mll, lo_njet]
  RunIISummer20UL17: [lo_inc, nlo_inc, lo_ht, nlo_mll, nlo_ptll, nlo_njet, nlo_njet_mll, lo_njet]
  RunIISummer20UL18: [lo_inc, nlo_inc, lo_ht, nlo_mll, nlo_ptll, nlo_njet, nlo_njet_mll, lo_njet]
  Run3Summer22: [lo_inc, nlo_inc, lo_ht]
  Run3Summer22EE: [lo_inc, nlo_inc, lo_ht]
  Run3Summer23: [lo_inc, nlo_inc, lo_ht]
  Run3Summer23BPix: [lo_inc, nlo_inc, lo_ht]
