# Systematic uncertainties: integrated luminosity fractional uncertainty
lumi_unc:
  # UL16/UL17 values from the LumiRecommendationsRun2 table saved in pdmv/run2 (2026 version:
  # 2016 1.2 %, 2017 0.82 %, 2018 0.84 %); UL18 keeps its earlier 2.5 % until the analysis
  # normalization is revisited (the same table quotes 59.56 fb-1 Golden Legacy for 2018).
  RunIISummer20UL16APV: 0.012
  RunIISummer20UL16: 0.012
  RunIISummer20UL17: 0.0082
  RunIISummer20UL18: 0.025     # 2.5% (UL2018)
  Run3Summer22: 0.014          # 1.4% (2022)
  Run3Summer22EE: 0.014        # 1.4% (2022EE)
  Run3Summer23: 0.014          # placeholder — update when 2023 lumi is finalized
  Run3Summer23BPix: 0.014      # placeholder — update when 2023 lumi is finalized
  RunIII2024Summer24: 0.014    # placeholder until 2024 lumi is finalized
  RunIII2025Summer25: 0.014    # placeholder (2025 lumi preliminary, no normtag yet)

# Drell-Yan Z-pT reweighting (QCD NLO/LO ratio x EW correction) evaluated on
# the generator-level Z pT of DYJets events.  Payloads are produced by
# scripts/convert_run2_dy_reweight.py from the Run 2 HNWRAnalyzer inputs
# (SKFlatAnalyzer HNWR/Run2Legacy_v4).  The nominal weight is applied to
# DYJets whenever an era is listed here (disable with --no-dy-zpt-reweight);
# --systs dyzpt adds the QCD scale/PDF/alphaS and EW variations.
#
# The 2018 payload was derived for the 13 TeV LO madgraphMLM HT-binned
# DYJetsToLL_M-50 samples (our UL18 dy_lo_ht fileset).  It is deliberately
# not mapped to the 13.6 TeV Run 3 eras: point a Run 3 era at it only for a
# study, never for a result.
dy_zpt_reweight:
  RunIISummer20UL18: data/reweights/RunII/2018/RunIISummer20UL18/dy_zpt_reweight_run2legacy_v4_2018.json

# DY reshape: data-driven (data - non-DY MC)/DY ratio vs leading AK4 jet pT
# (resolved) or DY-candidate AK8 jet pT (boosted), measured in the DY CRs with
# ee and mumu combined (Run 2 DYReshapeJetPt) and applied to every DY event in
# every region.  Derive with scripts/derive_dy_reshape.py from a production
# that had the Z-pT reweighting on; the reshape is only applied together with
# it.  Disable with --no-dy-reshape; --systs dyreshape adds the stat and
# ee-vs-mumu variations.
#
# UL18: derived 2026-09-07 from the local production dyreshape_20260907 (data +
# bkg, DY lo_ht, Z-pT reweight on).  Its overall level (~1.5 at low jet pT
# falling to ~0.85) absorbs the NNLO/LO normalization that Run 2 carried in
# its DY cross sections (~1.35x ours); the product is what matters.
dy_reshape:
  RunIISummer20UL18: data/reweights/RunII/2018/RunIISummer20UL18/dy_reshape_run2jetpt_20260907.json

# Signal NLO/LO k-factor vs generator-level m(lN), applied as k(m_lN)/<k>
# (shape only: the signal cross sections in the configs are AN-19-083 LO x <k>).
# Payload from scripts/convert_run2_signal_kfactor.py (SKFlat HNWR/Run2Legacy_v4,
# AN-19-083 Appendix A).  Disable with --no-signal-kfactor.  Eras absent here
# apply no k-factor reweighting.
signal_kfactor:
  RunIISummer20UL18: data/reweights/RunII/2018/RunIISummer20UL18/signal_kfactor_run2legacy_v4_2018.json

# HEM 15/16 veto (2018 only).  Ported from the Run 2 HNWRAnalyzer
# (``isHEMVetoEvent``): an event is dropped when one of the two leptons the
# region is built from is an electron with eta < eta_max and
# phi_min < phi < phi_max.  Applied to data and MC alike for the whole year,
# on electron eta (not supercluster eta), exactly as in Run 2.  Eras absent
# here apply no veto.
hem_veto:
  RunIISummer20UL18:
    eta_max: -1.25
    phi_min: -1.62
    phi_max: -0.82

# LSF scale factor: data/MC efficiency of the LSF3 > 0.75 requirement on the
# AK8 jet that contains the sub-leading lepton, keyed by the flavour of that
# lepton.  Applied to the boosted SR and flavour-CR regions (not the boosted
# DY CR, which has no LSF requirement).  Values from AN-19-083 Table 60
# (injected-lepton method), as hard-coded in HNWRAnalyzer::LSFSF.  Eras absent
# here apply no LSF scale factor; Run 3 needs its own measurement.
lsf_sf:
  RunIISummer20UL18:
    electron: {value: 1.05, err_up: 0.07, err_down: 0.06}
    muon:     {value: 1.04, err_up: 0.06, err_down: 0.05}

# Physics thresholds (single source of truth for analysis cuts)
cuts:
  lepton_pt_min: 53
  electron_eta_max: 2.5
  muon_eta_max: 2.4
  muon_highPtId: 2
  muon_iso_max: 0.1
  ak4_pt_min: 40
  ak4_eta_max: 2.4
  ak8_pt_min: 200
  ak8_eta_max: 2.4
  ak8_msoftdrop_min: 40
  ak8_lsf3_min: 0.75
  lead_lepton_pt_min: 60
  sublead_lepton_pt_min: 53
  mll_dy_low: 60
  mll_dy_high: 150
  mll_sr_min: 200
  mll_sr_high_min: 400
  mlljj_min: 800
  dr_min: 0.4
  dphi_boosted_min: 2.0
  dr_loose_veto: 0.01
  dr_ak8_loose: 0.8
  jet_veto_pt_min: 15
  jet_veto_em_neFrac: 0.9